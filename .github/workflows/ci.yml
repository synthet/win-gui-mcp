name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build samples (gate tests)
        run: |
          dotnet build samples/WinGuiMcp.WinFormsSample/WinGuiMcp.WinFormsSample.csproj
          dotnet build samples/WinGuiMcp.WpfSample/WinGuiMcp.WpfSample.csproj

      - name: Build and test
        run: dotnet test WinGuiMcp.sln
